name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: huntflow
          POSTGRES_PASSWORD: huntflow
          POSTGRES_DB: huntflow
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U huntflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://huntflow:huntflow@localhost:5433/huntflow?schema=public
      DATABASE_URL_TEST: postgresql://huntflow:huntflow@localhost:5433/huntflow_test?schema=public
      JWT_SECRET: ci-test-jwt-secret-min-16-chars
      NOTIFICATION_JOBS_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Setup test database
        run: npm run db:test:setup

      - name: Build contracts
        run: npm run build:contracts

      - name: Unit tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: huntflow
          POSTGRES_PASSWORD: huntflow
          POSTGRES_DB: huntflow
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U huntflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://huntflow:huntflow@localhost:5433/huntflow?schema=public
      JWT_SECRET: ci-test-jwt-secret-min-16-chars
      NOTIFICATION_JOBS_ENABLED: 'false'
      CI: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Migrate and seed dev database
        run: |
          npm run db:deploy --workspace @huntflow/db
          npm run db:seed

      - name: Build contracts
        run: npm run build:contracts

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: E2E tests
        run: npm run test:e2e
